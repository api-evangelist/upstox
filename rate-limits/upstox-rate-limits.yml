exhaustion:
  status_code: 429
  error_code: UDAPI10005
  error_message: Too Many Request Sent
  consequence: >-
    The documentation states that exceeding limits "might result in temporary suspension of access" —
    it does not state a cooldown duration.
headers:
  documented: false
  note: >-
    Upstox documents no rate-limit response headers. No X-RateLimit-*, no RateLimit-* (RFC 9331 style),
    no Retry-After appears on the rate-limiting page, in the request/response structure pages, or in the
    OpenAPI definition's response headers. An agent has no way to read remaining quota or a retry
    interval before it is throttled — it can only detect exhaustion after the fact from HTTP 429 with
    error code UDAPI10005.
websocket_limits:
  note: >-
    Streaming limits are published separately under the Upstox Plus plan — up to 5 concurrent WebSocket
    connections per user and D30 subscription mode supporting up to 50 instruments per connection.
  source: https://upstox.com/developer/api-documentation/announcements/websocket-plus
regulatory_basis:
  circular_date: '2025-05-05'
  note: >-
    Rate limiting for retail investors participating in algo trading is classified into two categories by
    an exchange circular dated 5 May 2025; SEBI-registered algos get 5x the per-second order throughput.
