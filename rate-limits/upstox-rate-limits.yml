name: Upstox Developer API rate limits
description: >-
  Upstox publishes explicit per-API, per-user rate limits on a dedicated documentation page, split into
  four bands and shaped by the exchange circular dated 5 May 2025 that classifies retail algo trading
  into registered and unregistered categories. The provider does not document any RateLimit-* or
  Retry-After response headers, so an agent cannot read remaining quota at runtime; the only runtime
  signal is the application error code UDAPI10005 ("Too Many Request Sent") returned with HTTP 429.
