apis:
- aid: upstox:upstox-developer-api
  name: Upstox Developer API
  description: >-
    The Upstox Developer API is a free OAuth 2.0 REST and WebSocket suite for building trading and
    investment applications against a live SEBI-registered brokerage account. It covers order placement,
    modification and cancellation (V2 and the newer V3 endpoints with order slicing), multi-order and
    exit-all-positions batch operations, GTT and trailing-stop-loss conditional orders, portfolio
    holdings, positions and MTF positions, funds and margin, brokerage and charge calculation,
    trade-wise profit and loss reporting, market quotes with LTP/OHLC/full depth and option greeks,
    historical and intraday candle data, expired instrument history for backtesting, option chains and
    contracts, company fundamentals by ISIN, IPO listing and application, mutual fund orders, SIPs and
    holdings, fund pay-in and payout management, market information analytics (FII/DII activity, OI,
    change in OI, max pain, put-call ratio), a kill switch, static IP management for algo-trading
    compliance, and streaming market-data and portfolio feeds over WebSocket.
  humanURL: https://upstox.com/developer/api-documentation/
  baseURL: https://api.upstox.com
  tags:
  - Orders
  - Portfolio
  - Market Data
  - Historical Data
  - Options
  - Mutual Funds
  - IPO
  - Fundamentals
  - Payments
  - WebSocket
