aid: upstox
name: Upstox
description: >-
  Upstox is a SEBI-registered Indian retail brokerage operated by Upstox Securities Private Limited, a
  wholly owned subsidiary of RKSV Securities India Private Limited, serving over 1.3 crore customers
  across equities, futures and options, commodities, currency, mutual funds, IPOs, NCDs, fixed deposits
  and insurance on NSE, BSE and MCX. Its Upstox Developer API is a free, OAuth 2.0 protected REST and
  WebSocket suite of 101 published operations covering order placement (including V3 slicing, multi-order
  and GTT/trailing-stop-loss), portfolio holdings and positions, funds and margin, brokerage and charge
  calculation, market quotes with option greeks, historical and intraday candles, expired-instrument
  history, company fundamentals, IPO application, mutual funds, payouts, news and market-information
  analytics. Upstox also runs a hosted, OAuth-protected Model Context Protocol server at mcp.upstox.com
  giving AI agents read-only access to a user's holdings, orders, positions, mutual funds, funds and
  profile, and publishes an official Agent Skill and Claude plugin marketplace alongside first-party
  SDKs for Python, Node.js, Java, PHP and .NET.
image: https://assets.upstox.com/website/images/upstox-new-logo.svg
