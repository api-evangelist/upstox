- aid: upstox:upstox-mcp-server
  name: Upstox MCP Server
  description: >-
    Upstox operates a hosted, OAuth-protected Model Context Protocol server at https://mcp.upstox.com/mcp
    that gives AI assistants — Claude Desktop and the Claude web app, Claude Code, ChatGPT in Developer
    mode, Cursor, and VS Code with GitHub Copilot — read-only access to a connected Upstox account:
    holdings, orders, positions, mutual funds, funds and profile. Authorization uses OAuth 2.0 with
    dynamic client registration and PKCE, advertised through RFC 8414 and RFC 9728 metadata documents
    on the MCP host, and account connections expire daily. The same server can be run locally from the
    open-source mcp-server-upstox-api Cloudflare Worker for development.
  humanURL: https://upstox.com/developer/api-documentation/mcp-integration
  baseURL: https://mcp.upstox.com/mcp
  tags:
  - MCP
  - AI Agents
  - Portfolio
  - Read Only
