tools:
  source: provider documentation (https://upstox.com/developer/api-documentation/mcp-integration)
  schemas_available: false
  schemas_note: Live tool schemas are OAuth-gated. The six entries below are the account data domains
    Upstox documents the MCP server as supporting, mapped to their backing REST operations in mcp/upstox-tool-crosswalk.yml.
    Tool identifiers are not published and are NOT invented here.
  domains:
  - name: profile
    reads: Account details, enabled exchanges, order types and product configuration.
  - name: funds_and_margin
    reads: Available margin and buying power by segment.
  - name: holdings
    reads: Long-term demat holdings with current value and P&L.
  - name: positions
    reads: Open intraday and delivery positions with unrealised P&L. Includes MTF positions.
  - name: orders
    reads: Order book for the trading day, order status and history.
  - name: mutual_funds
    reads: Mutual fund orders, SIPs and holdings.
guardrails:
  published: true
  source: https://upstox.com/developer/api-documentation/agent-quickstart
  rules:
  - Read-only by default — the MCP server cannot place orders, modify positions or move funds. Only the
    separate Agent Skill can execute trades.
  - Daily re-authorization — account connections expire every day and require fresh OAuth consent, limiting
    the window of any accidental or unauthorized access.
  - Verify before acting — Upstox states AI output is research support, not investment advice.
  - Least privilege — grant only the access a task needs and review rules files so the agent confirms
    before state-changing actions.
enterprise_note: On Claude Team and Enterprise plans the Upstox connector is a custom connector, so the
  Install/Connect control stays disabled until an organization Owner enables connectors and allows custom
  connectors.
