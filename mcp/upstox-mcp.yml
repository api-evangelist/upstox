name: Upstox MCP Server
description: 'Upstox operates a first-party hosted Model Context Protocol server that gives an AI assistant
  read-only access to a connected Upstox brokerage account. It is a genuine agent surface: an MCP client
  POSTs directly to https://mcp.upstox.com/mcp, authorizes over OAuth 2.0 with dynamic client registration
  and PKCE, and the account connection expires daily. Upstox also open-sources the server (a Cloudflare
  Worker) so a developer can run it locally, and ships a Claude plugin marketplace that installs it as
  a connector in one command. The MCP surface is deliberately narrower than the REST API — it reads six
  account domains and cannot place, modify or cancel anything. Write workflows are handled by the separate
  Upstox Agent Skill, which drives the Python SDK rather than MCP.'
deployment:
  mode: both
  endpoint: https://mcp.upstox.com/mcp
  install: /plugin marketplace add upstox/upstox-plugin-marketplace && /plugin install upstox-mcp@upstox-plugins-official
  package: https://github.com/upstox/mcp-server-upstox-api
  auth: oauth
  verified: probed
  probe_prior: (never probed)
  probe: gated
  probe_why: RFC 9728 challenge on the MCP path only
  checked: '2026-09-11'
  source: claimed-backlog re-probe 2026-09-11
deployment_detail:
  remote:
    endpoint: https://mcp.upstox.com/mcp
    transport: streamable HTTP
    probed: '2026-09-02'
    probe_method: POST {"jsonrpc":"2.0","id":1,"method":"tools/list"}
    probe_status: 401
    probe_body: '{"error":"invalid_token","error_description":"Missing or invalid access token"}'
    probe_note: The endpoint exists and is live. A 401 with an invalid_token error is the correct MCP
      authorization response to an anonymous call — the tool list and its inputSchemas require an authenticated
      OAuth session tied to a real Upstox brokerage account, which this pipeline does not hold. Tool names
      below are taken from the provider's own MCP integration documentation, not from the live manifest;
      their input schemas require authenticated introspection.
    oauth:
      authorization_server: https://mcp.upstox.com
      metadata: well-known/upstox-mcp-oauth-authorization-server.json
      protected_resource_metadata: well-known/upstox-mcp-oauth-protected-resource-mcp.json
      authorization_endpoint: https://mcp.upstox.com/authorize
      token_endpoint: https://mcp.upstox.com/token
      registration_endpoint: https://mcp.upstox.com/register
      revocation_endpoint: https://mcp.upstox.com/token
      grant_types:
      - authorization_code
      - refresh_token
      pkce:
      - plain
      - S256
      dynamic_client_registration: true
      reauthorization: Daily — Upstox expires the account connection every day and requires fresh OAuth
        consent.
  local:
    package: https://github.com/upstox/mcp-server-upstox-api
    language: TypeScript
    runtime: Cloudflare Worker (wrangler dev)
    install: git clone https://github.com/upstox/mcp-server-upstox-api && npm install && npm start
    local_endpoint: http://localhost:8787/mcp
    credentials: UPSTOX_CLIENT_ID and UPSTOX_CLIENT_SECRET in .dev.vars, from an app created at https://account.upstox.com/developer/apps
      with redirect URL http://localhost:8787/callback
    published_to_npm: false
    npm_note: package.json declares private true and version 0.0.0 — the server is source-distributed,
      not published as an npm package.
    note: This is a self-hosted variant of the same server, intended for development and testing. It is
      not a stdio server; it speaks HTTP on localhost and clients reach it through the mcp-remote bridge.
