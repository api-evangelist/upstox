  binding: 1:n
  confidence: high
  note: >-
    GET /v3/user/get-funds-and-margin and the v2 equivalent. Upstox documents "Available margins —
    real-time buying power and margin utilization" and links the margin APIs. Which version the server
    calls is not published.
- tool: holdings
  category: portfolio
  rest:
  - getHoldings
  binding: 1:1
  confidence: high
  note: GET /v2/portfolio/long-term-holdings.
- tool: positions
  category: portfolio
  rest:
  - getPositions
  - getMtfPositions
  binding: 1:n
  confidence: medium
  note: >-
    GET /v2/portfolio/short-term-positions plus GET /v3/portfolio/mtf-positions. The MCP docs list
    "Positions" as one domain and separately advertise MTF position questions in the server repository's
    example prompts, so both operations plausibly back it; the split is not published.
- tool: orders
  category: orders
  rest:
  - getOrderBook
  - getOrderStatus
  - getOrderDetails
  - getTradeHistory
  - getTradesByOrder
  binding: 1:n
  confidence: medium
  note: >-
    The MCP docs list "Orders" as a read domain and the server repository's example prompts cover the
    day's orders, pending orders, order history and order status — which maps to the order book, order
    details, order history and trade read operations. Exact operation set not published.
- tool: mutual_funds
  category: portfolio
  rest:
  - getMutualFundHoldings
  - getMutualFundOrders
  - getMutualFundOrder
  - getMutualFundSips
  binding: 1:n
  confidence: medium
  note: >-
    "Mutual funds" is a documented MCP read domain; the REST surface splits it into holdings, order book,
    order-by-id and SIPs. Which subset the server exposes is not published.
mcp_only: []
mcp_only_note: >-
  No MCP capability lacks a REST backing. The Upstox MCP server is a strict read-only projection of
  existing REST operations — there is no composite tool, no MCP-native aggregation and no capability
  reachable only through the agent surface.
