name: Upstox MCP to REST crosswalk
description: >-
  Binds each documented Upstox MCP capability domain to the REST operations that back it, and records
  what each surface can do that the other cannot. The divergence here is unusually clean and unusually
  large: the MCP server is read-only by design and covers six account domains, while the REST API
  exposes 101 operations including every write path. Nothing is MCP-only. Ninety-one REST operations
  have no MCP counterpart, and that is a deliberate safety boundary Upstox documents rather than an
  oversight — write workflows are routed to the Agent Skill, which drives the Python SDK directly.
surfaces:
  openapi:
    file: openapi/upstox-developer-api-openapi.yml
    live: https://api.upstox.com/v2/api-docs
    operations: 101
    gated: false
  mcp:
    url: https://mcp.upstox.com/mcp
    gated: true
    gated_note: >-
      tools/list returns HTTP 401 invalid_token without an authenticated OAuth session, so live tool
      identifiers and inputSchemas could not be read. Mapping below is by documented capability domain
      and semantics, and confidence is set accordingly.
  graphql:
    present: false
  agent_skill:
    repository: https://github.com/upstox/upstox-skills
    transport: upstox-python-sdk (not MCP)
    writes: true
crosswalk:
