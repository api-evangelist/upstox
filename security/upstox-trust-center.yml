certifications:
- name: ISO/IEC 27001:2022
  scope: Information Security Management System (ISMS)
  note: Risk assessment, security controls and continuous monitoring over confidentiality, integrity and availability of information assets.
- name: ISO/IEC 27701:2019
  scope: Privacy Information Management System (PIMS)
  note: Extends ISO 27001 to privacy — privacy by design, consent management and data subject rights.
- name: ISO 22301:2019
  scope: Business Continuity Management System (BCMS)
  note: Disaster recovery planning, redundancy and resilience for uninterrupted trading.
audits:
- type: VAPT
  auditor: CERT-In empanelled auditors
  cadence: periodic
  note: External vulnerability assessment and penetration testing by CERT-In approved partners; SAST and DAST are embedded in the SDLC alongside API security checks and CI/CD pipeline scans.
- type: Red Team / cyber crisis drills
  auditor: internal
  cadence: periodic
  note: Simulated attacker exercises covering in-memory execution, lateral movement and privilege escalation, plus tabletop incident-response drills.
- type: Third-party security review
  auditor: internal
  cadence: pre-onboarding
  note: Every third-party service provider is security reviewed before onboarding.
regulatory_frameworks:
- SEBI
