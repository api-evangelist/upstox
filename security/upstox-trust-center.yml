- NSE
- MCX
- CDSL
- IRDAI
- PFRDA
- Digital Personal Data Protection Act (India)
controls:
  infrastructure: Hybrid on-premises and cloud; network segmentation, DDoS protection, WAF with bot control enforcing OWASP Top 10.
  identity: Least-privilege access management; Zero Trust Network Access (ZTNA) for remote access.
  monitoring: 24/7 security operations centre with threat intelligence and automated alerting.
  endpoint: Continuous monitoring, advanced threat detection, anti-malware.
  data: Encryption at rest and in transit; data loss prevention controls.
  customer_auth: Multi-factor authentication — 1FA PIN verification plus 2FA OTP verification.
  privacy: Privacy by design, consent management, data subject access/correction/deletion, formal breach notification process.
