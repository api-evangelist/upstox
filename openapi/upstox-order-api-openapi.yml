    GttModifyOrderRequest:
      type: object
      properties:
        type:
          type: string
          description: 'Type of GTT order. It can be one of the following:

            SINGLE refers to a single-leg GTT order

            MULTIPLE refers to a multi-leg GTT order'
          enum:
          - SINGLE
          - MULTIPLE
          example: SINGLE
        quantity:
          type: integer
          format: int32
          description: Quantity with which the order is to be placed
          example: 1
        rules:
          type: array
          description: List of rules defining the conditions for each leg in the GTT order
          items:
            $ref: '#/components/schemas/GttRule'
        gtt_order_id:
          type: string
          description: Unique identifier of the GTT order to be modified
          example: GTT-12345678
          pattern: ^GTT-.+$
      required:
      - gtt_order_id
      - quantity
      - rules
      - type
    GttCancelOrderRequest:
      type: object
      properties:
