          example: GTT-12345678
          pattern: ^GTT-.+$
      required:
      - gtt_order_id
    GttPlaceOrderRequest:
      type: object
      properties:
        type:
          type: string
          description: 'Type of GTT order. It can be one of the following:

            SINGLE refers to a single-leg GTT order

