  /v2/order/history:
    get:
      tags:
      - Order
      summary: Get order history
      description: 'This API provides the details of the particular order the user has placed. The orders placed by the user is transient for a day and are cleared by the end of the trading session. This API returns all states of the orders, namely, open, pending, and filled ones.


        The order history can be requested either using order_id or tag.


        If both the options are passed, the history of the order which precisely matches both the order_id and tag will be returned in the response.


        If only the tag is passed, the history of all the associated orders which matches the tag will be shared in the response.'
      operationId: getOrderDetails
      parameters:
      - name: order_id
        in: query
        description: The order reference ID for which the order history is required
        required: false
        schema:
          type: string
          pattern: ^[-a-zA-Z0-9]+
        example: 12345667890
      - name: tag
        in: query
        description: The unique tag of the order for which the order history is being requested
        required: false
        schema:
          type: string
        example: 2qdqjppebx
      responses:
        '405':
          description: Method Not Allowed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApiGatewayErrorResponse'
        '400':
          description: UDAPI1010 - Order id accepts only alphanumeric characters and '-'<br>UDAPI1023 - Order id is required<br>UDAPI100010 - Unknown order id | order request rejected
