    GttRule:
      type: object
      properties:
        strategy:
          type: string
          description: 'Defines the strategy for the GTT order leg:

            ENTRY - First leg order

            STOPLOSS - Stop-loss order

            TARGET - Target order'
          enum:
          - ENTRY
          - STOPLOSS
          - TARGET
          example: ENTRY
        trigger_type:
          type: string
          description: Trigger type for each leg of the order
          enum:
          - ABOVE
          - BELOW
          - IMMEDIATE
          example: ABOVE
        trigger_price:
          type: number
          format: double
          description: Trigger price for the GTT order leg
          example: 1500.5
        trailing_gap:
          type: number
          format: double
          description: Optional parameter defining the trailing gap for the GTT order
          example: 0.5
        market_protection:
          type: number
          format: double
          description: Optional parameter defining the market protection percentage for the GTT order
          example: 3
          maximum: 25
          minimum: -1
