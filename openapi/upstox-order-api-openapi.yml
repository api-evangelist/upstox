          example: 50091502
          readOnly: true
        order_ref_id:
          type: string
          description: The order reference ID for which the order must be modified
          example: udapi-aqwsed14356
          readOnly: true
        order_timestamp:
          type: string
          description: User readable timestamp at which the order was placed
          example: 23-Apr-2021 14:22:06
          readOnly: true
    OrderData:
      type: object
      properties:
        exchange:
          type: string
          description: Exchange to which the order is associated
          enum:
          - NSE
          - NFO
          - CDS
          - BSE
          - BFO
          - BCD
          - MCX
          - NSCOM
          example: NSE
          readOnly: true
        price:
          type: number
          format: float
          description: Price at which the order was placed
          example: 120.01
          readOnly: true
        product:
          type: string
          description: Shows if the order was either Intraday, Delivery, CoverOrder or OneCancelsOther
          enum:
          - I
          - D
          - CO
          - OCO
          - MTF
          example: D
          readOnly: true
        quantity:
          type: integer
          format: int32
          description: Quantity with which the order was placed
          example: 1
          readOnly: true
        status:
          type: string
          description: Indicates the current status of the order. Valid order status’ are outlined in the table below
          example: complete
          readOnly: true
        tag:
          type: string
          description: Tag to uniquely identify an order
          readOnly: true
        validity:
          type: string
          description: Order validity (DAY- Day and IOC- Immediate or Cancel (IOC) order)
          enum:
          - DAY
          - IOC
          - EOS
          example: DAY
          readOnly: true
        average_price:
          type: number
          format: float
          description: Average price at which the qty got traded
          example: 120.01
          readOnly: true
        disclosed_quantity:
          type: integer
          format: int32
          description: The quantity that should be disclosed in the market depth
          example: 1
          readOnly: true
        exchange_order_id:
          type: string
          description: Unique order ID assigned by the exchange for the order placed
          example: 221013001021540
          readOnly: true
        exchange_timestamp:
          type: string
          description: User readable time at which the order was placed or updated
          example: 03-Aug-2017 15:03:42
          readOnly: true
        instrument_token:
          type: string
          description: Identifier issued by Upstox used for subscribing to live market quotes
          example: 151064324
          readOnly: true
        is_amo:
          type: boolean
          description: Signifies if the order is an After Market Order
          example: false
          readOnly: true
        status_message:
          type: string
          description: Indicates the reason when any order is rejected, not modified or cancelled
          readOnly: true
        order_id:
          type: string
          description: Unique order ID assigned internally for the order placed
          example: 221013001021541
          readOnly: true
        order_request_id:
          type: string
          description: Apart from 1st order it shows the count of how many requests were sent
          example: 221013001021542
          readOnly: true
        order_type:
          type: string
          description: 'Type of order. It can be one of the following

            MARKET refers to market order<br>LIMIT refers to Limit Order<br>SL refers to Stop Loss Limit<br>SL-M refers to Stop loss market'
          enum:
          - MARKET
          - LIMIT
          - SL
          - SL-M
          example: MARKET
          readOnly: true
        parent_order_id:
          type: string
          description: In case the order is part of the second or third leg of a CO or OCO, the parent order ID is indicated here
          example: 221013001021543
          readOnly: true
        tradingsymbol:
          type: string
          deprecated: true
          description: Shows the trading symbol of the instrument
          example: GMR
          readOnly: true
        trading_symbol:
          type: string
          description: Shows the trading symbol of the instrument
          example: GMR
          readOnly: true
        order_timestamp:
          type: string
          description: User readable timestamp at which the order was placed
          example: 23-Apr-2021 14:22:06
          readOnly: true
        filled_quantity:
          type: integer
          format: int32
          description: The total quantity traded from this particular order
          example: 1
          readOnly: true
        transaction_type:
          type: string
          description: Indicates whether the order was a buy or sell order
          enum:
          - BUY
          - SELL
          example: BUY
          readOnly: true
        trigger_price:
          type: number
          format: float
          description: If the order was a stop loss order then the trigger price set is mentioned here
          example: 120.01
          readOnly: true
        placed_by:
          type: string
          description: Uniquely identifies the user
          example: 200123
          readOnly: true
        variety:
          type: string
          description: Order complexity
          example: SIMPLE
          readOnly: true
    MultiOrderRequest:
      type: object
      properties:
        quantity:
          type: integer
          format: int32
          description: Quantity with which the order is to be placed
          example: 1
        product:
          type: string
          description: Signifies if the order was either Intraday, Delivery, CO or OCO
          enum:
          - I
          - D
          example: D
        validity:
          type: string
          description: It can be one of the following - DAY(default), IOC
          enum:
          - DAY
          - IOC
          example: DAY
        price:
          type: number
          format: float
          description: Price at which the order will be placed
          example: 0
        tag:
          type: string
          maxLength: 40
          minLength: 0
        slice:
          type: boolean
          description: To divide the order line based on predefined exchange definitions
          example: false
        instrument_token:
          type: string
          description: Key of the instrument
          example: NSE_EQ|INE848E01016
        order_type:
          type: string
          description: 'Type of order. It can be one of the following

            MARKET refers to market order

            LIMIT refers to Limit Order

            SL refers to Stop Loss Limit

            SL-M refers to Stop Loss Market'
          enum:
          - MARKET
          - LIMIT
          - SL
          - SL-M
          example: MARKET
        transaction_type:
          type: string
          description: Indicates whether its a buy or sell order
          enum:
          - BUY
          - SELL
          example: BUY
        disclosed_quantity:
          type: integer
          format: int32
          description: The quantity that should be disclosed in the market depth
          example: 0
        trigger_price:
          type: number
          format: float
          description: If the order is a stop loss order then the trigger price to be set is mentioned here
          example: 0
        is_amo:
          type: boolean
          description: Signifies if the order is an After Market Order
          example: false
        correlation_id:
          type: string
          description: A unique identifier for tracking individual orders within the batch
          example: 12345678
          maxLength: 20
          minLength: 1
        market_protection:
          type: number
          format: float
          description: Optional parameter defining the market protection percentage for the multi order
          example: 3
          maximum: 25
          minimum: -1
      required:
      - correlation_id
      - disclosed_quantity
      - instrument_token
      - is_amo
      - order_type
      - price
      - product
      - quantity
      - slice
      - transaction_type
      - trigger_price
      - validity
