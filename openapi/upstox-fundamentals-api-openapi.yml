  /v2/fundamentals/{isin}/key-ratios:
    get:
      tags:
      - Fundamentals
      summary: Get Key Ratios
      description: Fetches key financial ratios for the given ISIN.
      operationId: getKeyRatios
      parameters:
      - name: isin
