components:
  schemas:
    PaymentHistoryData:
      type: object
      properties:
        amount:
          type: number
          format: double
        mode:
          type: string
        status:
          type: string
        reason:
          type: string
        currency:
          type: string
        eta:
          type: string
        last_updated_at:
          type: string
        bank_name:
          type: string
        transaction_id:
          type: string
        total_charges:
          type: number
          format: double
        charges_category:
          type: string
        created_at:
          type: string
    PayoutModesData: {}
    PayoutModesResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - success
          - error
          - partial_success
        data:
          $ref: '#/components/schemas/PayoutModesData'
          description: Available payout modes with eligibility details
    ApiGatewayErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - success
          - error
          - partial_success
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Problem'
    InitiatePayoutRequest:
      type: object
      properties:
        mode:
          type: string
          description: Withdrawal mode. NEFT or IMPS
          example: NEFT
          minLength: 1
          pattern: ^(NEFT|IMPS)$
        amount:
          type: number
          format: double
          description: Withdrawal amount in INR
          example: 5000.0
          minimum: 100.0
      required:
      - amount
      - mode
    PayoutDetails:
      type: object
      properties:
        status:
          type: string
        mode:
          type: string
        amount:
          type: number
          format: double
        currency:
          type: string
        eta:
          type: string
        message:
          type: string
        transaction_id:
          type: string
        created_at:
          type: string
        bank_name:
          type: string
        transaction_fee:
          type: string
    PayoutDetailsResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - success
          - error
          - partial_success
        data:
          $ref: '#/components/schemas/PayoutDetails'
          description: Response data for initiate payout request
    Problem:
      type: object
      properties:
        errorCode:
          type: string
          deprecated: true
          description: Unique code for the error state
        message:
          type: string
          description: Verbose message for the error state
        propertyPath:
          type: string
          deprecated: true
          description: Path to property failing validation
        invalidValue:
          deprecated: true
          description: Invalid value for the property failing validation
        error_code:
          type: string
        property_path:
          type: string
        invalid_value: {}
    ModifyPayoutRequest:
      type: object
      properties:
        amount:
          type: number
          format: double
          description: Withdrawal amount in INR
          example: 5000.0
          minimum: 100.0
      required:
      - amount
    PaymentHistoryResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - success
          - error
          - partial_success
        data:
          type: array
          description: List of payment history records
          items:
            $ref: '#/components/schemas/PaymentHistoryData'
  securitySchemes:
    OAUTH2:
      type: oauth2
      scheme: BEARER
      flows:
        authorizationCode:
          authorizationUrl: https://api-v2.upstox.com/v2/login/authorization/dialog
          tokenUrl: https://api-v2.upstox.com/v2/login/authorization/token
          scopes:
            read: Read access
            write: Write access
