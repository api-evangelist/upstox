      - name: expiry
        in: query
        description: Expiry date in YYYY-MM-DD format
        required: true
        schema:
          type: string
        example: '2026-05-19'
      - name: date
        in: query
        description: Date in YYYY-MM-DD format for which PCR data is required
        required: true
