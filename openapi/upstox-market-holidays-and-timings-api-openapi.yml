components:
  schemas:
    HolidayData:
      type: object
      properties:
        date:
          type: string
          format: date-time
        description:
          type: string
        holiday_type:
          type: string
          enum:
          - ALL
          - SETTLEMENT_HOLIDAY
          - TRADING_HOLIDAY
          - SPECIAL_TIMING
        closed_exchanges:
          type: array
          items:
            type: string
        open_exchanges:
          type: array
          items:
            $ref: '#/components/schemas/ExchangeTimingData'
    GetExchangeTimingResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - success
          - error
          - partial_success
        data:
          type: array
          description: Response data for exchange timing list
          items:
            $ref: '#/components/schemas/ExchangeTimingData'
    GetMarketStatusResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - success
          - error
          - partial_success
        data:
          $ref: '#/components/schemas/MarketStatusData'
          description: Response data for market live status
    AnalyticsResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - success
          - error
          - partial_success
        data: {}
    GetHolidayResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - success
          - error
          - partial_success
        data:
          type: array
          description: Response data for holiday list
          items:
            $ref: '#/components/schemas/HolidayData'
    ExchangeTimingData:
      type: object
      properties:
        exchange:
          type: string
        start_time:
          type: integer
          format: int64
        end_time:
          type: integer
          format: int64
    MarketStatusData:
      type: object
      properties:
        exchange:
          type: string
        status:
          type: string
        last_updated:
          type: integer
          format: int64
        cas_eligible_status:
          $ref: '#/components/schemas/CasEligibleStatusData'
          description: CAS (Closing Auction Session) status of the segment. Present only for segments where CAS exists (e.g. NSE_EQ); absent otherwise.
    CasEligibleStatusData:
      type: object
      properties:
        status:
          type: string
          description: The CAS (Collateral Auction Session / Closing Auction Session) status of the segment.
          enum:
          - NORMAL_OPEN
          - NORMAL_CLOSE
          - PRE_OPEN_START
          - PRE_OPEN_END
          - CLOSING_START
          - CLOSING_END
          - CTS_CLOSE
          - CAS_LM_START
          - CAS_M_STOP
          - CAS_STOP
        last_updated:
          type: integer
          format: int64
          description: The timestamp (in milliseconds) when the CAS status was last updated.
    Problem:
      type: object
      properties:
        errorCode:
          type: string
          deprecated: true
          description: Unique code for the error state
        message:
          type: string
          description: Verbose message for the error state
        propertyPath:
          type: string
          deprecated: true
          description: Path to property failing validation
        invalidValue:
          deprecated: true
          description: Invalid value for the property failing validation
        error_code:
          type: string
        property_path:
          type: string
        invalid_value: {}
    ApiGatewayErrorResponse:
      type: object
      properties:
        status:
          type: string
          enum:
          - success
          - error
          - partial_success
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Problem'
  securitySchemes:
    OAUTH2:
      type: oauth2
      scheme: BEARER
      flows:
        authorizationCode:
          authorizationUrl: https://api-v2.upstox.com/v2/login/authorization/dialog
          tokenUrl: https://api-v2.upstox.com/v2/login/authorization/token
          scopes:
            read: Read access
            write: Write access
