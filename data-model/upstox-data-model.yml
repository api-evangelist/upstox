entities:
- name: Instrument
  schemas:
  - Instrument
  - InstrumentData
  key: instrument_key
  description: A tradable security or index on NSE, BSE or MCX. The root of the graph.
- name: Order
  schemas:
  - OrderData
  - OrderBookData
  - OrderMetadata
  key: order_id
  description: A trading order in one of the documented order statuses, with product, validity, variety, price and quantity.
- name: Trade
  schemas:
  - TradeData
  - TradeHistoryResponseTradeData
  key: trade_id
  description: An execution (fill) against an order.
- name: GttOrder
  schemas:
  - GttOrderData
  - GttOrderDetails
  - GttRule
  - Rule
  key: gtt_order_id
  description: A Good Till Triggered conditional order carrying one or more rules (ENTRY, STOPLOSS, TARGET), each with its own trigger and resulting order_id.
- name: Position
  schemas:
  - PositionData
  key: instrument_key + product
  description: An open intraday, delivery or MTF position with realised and unrealised P&L.
- name: Holding
  schemas:
  - HoldingsData
  key: isin
  description: A long-term demat holding.
- name: FundsAndMargin
  schemas:
