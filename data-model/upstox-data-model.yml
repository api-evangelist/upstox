name: Upstox data model
description: >-
  The Upstox object graph hangs off one identifier — instrument_key — and everything tradable, quotable
  or reportable references it. Orders, GTT rules, positions, holdings, quotes, candles, option chains,
  margins and news are all keyed on it. The second axis is the account: a user has funds and margin,
  holdings, positions, orders, trades, mutual fund folios, IPO applications and payment transactions.
  Relationships are expressed almost entirely as id-reference fields rather than as nested $refs — the
  spec has 106 schemas with $ref links, but nearly all of them are envelope-to-payload wrappers, not
  entity-to-entity edges. An agent joins Upstox entities by identifier, not by traversal.
primary_key:
  name: instrument_key
  format: 'SEGMENT|IDENTIFIER'
  examples:
  - value: NSE_EQ|INE002A01018
    meaning: Equity — segment plus ISIN (ISO 6166)
  - value: NSE_INDEX|Nifty 50
    meaning: Index — segment plus index name
  - value: NSE_FO|43919
    meaning: Derivative — segment plus numeric exchange token, which changes per expiry
  segments:
  - NSE_EQ
  - NSE_FO
  - NSE_INDEX
  - BSE_EQ
  - BSE_FO
  - BSE_INDEX
  - NCD_FO
  - BCD_FO
  - MCX_FO
  resolution: >-
    Human names must be resolved to instrument_key via GET /v2/instruments/search (searchInstrument) or
    the downloadable instrument files. Derivative tokens must never be guessed — they are reassigned per
    expiry.
  usage:
    instrument_key_fields: 9
    instrument_token_fields: 18
  note: >-
    The spec carries both instrument_key and the legacy instrument_token spelling on the same objects
    (18 schemas use instrument_token, 9 use instrument_key), and the webhook payload emits both. This is
    a live naming migration an agent must be aware of when matching objects across surfaces.
identifiers:
- field: instrument_key
  identifies: Instrument
  scope: global
- field: instrument_token
  identifies: Instrument
  scope: global
  deprecated: true
  note: Legacy spelling of instrument_key, still emitted on webhook payloads and in 18 schemas.
- field: isin
  identifies: Company / security
  scope: global
  standard: ISO 6166
  note: The whole Company Fundamentals suite is addressed by ISIN as a path parameter.
- field: order_id
