  scope: order
- field: gtt_order_id
  identifies: GTT order
  scope: account
  format: 'GTT-<alphanumeric>, e.g. GTT-CU25270200024002'
- field: trade_id
  identifies: Trade (fill)
  scope: account
- field: transaction_id
  identifies: Payin / payout transaction
  scope: account
- field: sip_id
  identifies: Mutual fund SIP registration
  scope: account
- field: folio
  identifies: Mutual fund folio
  scope: account
- field: settlement_id
  identifies: Settlement
  scope: account
- field: user_id
  identifies: Upstox user
  scope: global
- field: client_id
  identifies: Developer app
  scope: platform
- field: correlation_id
  identifies: Leg within a multi-order request
  scope: request
- field: underlying_key
  identifies: Underlying instrument of a derivative
  scope: global
