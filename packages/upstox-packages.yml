description: >-
  Upstox publishes five first-party SDKs, all generated from its OpenAPI definition and all listed on
  the "Upstox Generated SDK's" documentation page with the exact install command and source repository.
  Four of the five shipped a coordinated release on 2026-08-19. The Java SDK is the outlier: its GitHub
  repository was pushed the same day, but Maven Central has published nothing since version 1.16 on
  2025-06-09 — a 14-month gap during which the API added IPO application, payouts, fundamentals,
  smartlists, kill switch, static IP and market-information endpoints.
