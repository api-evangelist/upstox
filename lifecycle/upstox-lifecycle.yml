name: Upstox API lifecycle
description: >-
  Upstox versions by URL path major (/v2/, /v3/) and migrates endpoint by endpoint rather than cutting
  the whole API over at once, so v2 and v3 operations coexist in a single OpenAPI definition. It
  publishes deprecation notices as dated announcements with named v3 replacements, and it has actually
  executed shutdowns (Market Data Feeder V2 stopped 22 August 2025). What it does not publish is a
  formal deprecation policy document, a stated minimum notice period, an SLA, or RFC 8594 Sunset and
  Deprecation response headers — the notice lives in prose on an announcements page, not in the
  contract or in the response.
versioning:
  scheme: URL path major version
  current: 'v3 for orders, historical/intraday candles, market quotes and the market data feed; v2 for everything else'
  header_version: false
  note: >-
    The March 2024 "New URL and Simplified Headers" announcement removed the previously required
    Api-Version header. The OpenAPI definition declares a single server (https://api-v2.upstox.com) and
    carries both /v2/ and /v3/ paths.
  policy_url: null
deprecation:
  policy_published: false
  policy_url: null
  notices_published: true
  notices_url: https://upstox.com/developer/api-documentation/announcements
  headers:
    sunset: false
    deprecation: false
    note: >-
      No RFC 8594 Sunset header and no Deprecation header appears in the OpenAPI response definitions or
      in the request/response documentation. Deprecation is communicated only by announcement page.
  spec_marked_deprecated_operations: 0
  spec_note: >-
    Zero operations in the published OpenAPI carry deprecated: true, even though nine v2 endpoints are
    formally deprecated on the announcements page. The contract does not reflect the deprecation state
    the docs assert — an agent reading only the spec cannot tell which operations are on the way out.
  deprecated_operations:
  - operationId: placeOrder_1
    path: /v2/order/place
    replacement: placeOrder (/v3/order/place)
    announced: '2025-06-30'
  - operationId: modifyOrder_1
    path: /v2/order/modify
    replacement: modifyOrder (/v3/order/modify)
    announced: '2025-06-30'
  - operationId: cancelOrder_1
    path: /v2/order/cancel
    replacement: cancelOrder (/v3/order/cancel)
    announced: '2025-06-30'
  - operationId: getHistoricalCandleData_2
    path: /v2/historical-candle/{instrumentKey}/{interval}/{to_date}
    replacement: getHistoricalCandleData (/v3/historical-candle/...)
    announced: '2025-06-30'
  - operationId: getIntraDayCandleData_1
    path: /v2/historical-candle/intraday/{instrumentKey}/{interval}
    replacement: getIntraDayCandleData (/v3/historical-candle/intraday/...)
    announced: '2025-06-30'
  - operationId: getMarketQuoteOHLC
    path: /v2/market-quote/ohlc
    replacement: getMarketQuoteOHLCV3 (/v3/market-quote/ohlc)
    announced: '2025-06-30'
  - operationId: ltp
