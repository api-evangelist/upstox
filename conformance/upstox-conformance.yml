  source: asyncapi/upstox-webhooks.yml
- id: rate-limit-headers
  conforms: false
  evidence: No X-RateLimit-*, RateLimit-* or Retry-After headers are documented or declared. Exhaustion is signalled only by HTTP 429 with error code UDAPI10005.
  source: rate-limits/upstox-rate-limits.yml
domain_standards:
- id: fix-protocol
  conforms: false
  evidence: >-
    The string "FIX" appears nowhere in the OpenAPI definition or the developer documentation. Upstox
    exposes a JSON/REST plus Protobuf-over-WebSocket surface for retail algo traders, not a FIX session
    for institutional order routing.
  source: openapi/upstox-developer-api-openapi.yml
- id: iso-20022
  conforms: false
  evidence: >-
    No ISO 20022 message types anywhere in the contract. Fund movement is modelled as Upstox-native
    payin/payout objects with NEFT and IMPS as Indian domestic rails, not as pain/pacs messages.
  source: openapi/upstox-developer-api-openapi.yml
- id: mifid-ii
  conforms: false
  evidence: >-
    Not applicable and not claimed. Upstox Securities Private Limited is SEBI-registered
    (INZ000315837) and operates on NSE, BSE and MCX under Indian securities regulation; MiFID II is an
    EU regime.
  source: https://upstox.com/trust-security/
- id: iso-6166-isin
  conforms: true
  on_regime_shortlist: false
  evidence: >-
    The whole Company Fundamentals suite is keyed on ISIN as a first-class path parameter — seven
    operations at /v2/fundamentals/{isin}/... (profile, balance-sheet, cash-flow, income-statement,
    share-holdings, key-ratios, corporate-actions), and instrument keys embed the ISIN
    (e.g. NSE_EQ|INE002A01018). ISIN is ISO 6166, a genuine cross-border securities identifier scheme, so
    a caller who already speaks ISIN can address Upstox fundamentals with no mapping table. It is not on
    the capital-markets regime's declared standards shortlist (fix-protocol, mifid-ii, iso-20022), so it
    is recorded here as an honest observation rather than as a shortlist match.
  source: openapi/upstox-developer-api-openapi.yml
