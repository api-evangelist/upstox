name: Upstox standards conformance
description: >-
  What the Upstox contract and its supporting surfaces actually assert conformance to. The strong
  results are OAuth 2.0 (authorization code with the full RFC 8414 / RFC 9728 discovery pair on the MCP
  host, dynamic client registration and PKCE S256) and MCP itself. The notable absence for a capital
  markets provider is any domain protocol conformance: no FIX, no ISO 20022, no MiFID reporting shape —
  Upstox is an India-domestic retail brokerage governed by SEBI circulars rather than by the
  cross-border protocols the capital-markets regime shortlists.
conformance:
- id: oauth2
  conforms: true
  evidence: >-
    OpenAPI components.securitySchemes.OAUTH2 declares type oauth2 with an authorizationCode flow —
    authorizationUrl https://api-v2.upstox.com/v2/login/authorization/dialog, tokenUrl
    https://api-v2.upstox.com/v2/login/authorization/token, scopes read and write. Confirmed by the
    Authentication documentation page.
  source: openapi/upstox-developer-api-openapi.yml
- id: rfc8414
  conforms: true
  evidence: >-
    https://mcp.upstox.com/.well-known/oauth-authorization-server returns HTTP 200 with a complete
    OAuth 2.0 Authorization Server Metadata document — issuer, authorization_endpoint, token_endpoint,
    registration_endpoint, revocation_endpoint, grant types authorization_code and refresh_token,
    token endpoint auth methods client_secret_basic/client_secret_post/none.
  source: well-known/upstox-mcp-oauth-authorization-server.json
- id: rfc9728
  conforms: true
  evidence: >-
    https://mcp.upstox.com/.well-known/oauth-protected-resource and
    /.well-known/oauth-protected-resource/mcp both return HTTP 200 with OAuth 2.0 Protected Resource
    Metadata naming resource https://mcp.upstox.com/mcp, authorization_servers
    [https://mcp.upstox.com], bearer_methods_supported [header].
  source: well-known/upstox-mcp-oauth-protected-resource-mcp.json
- id: rfc7591
  conforms: true
  evidence: The MCP authorization server metadata advertises registration_endpoint https://mcp.upstox.com/register — OAuth 2.0 Dynamic Client Registration.
  source: well-known/upstox-mcp-oauth-authorization-server.json
- id: rfc7636
  conforms: true
  evidence: code_challenge_methods_supported declares both plain and S256 (PKCE).
  source: well-known/upstox-mcp-oauth-authorization-server.json
- id: oidc
  conforms: false
  evidence: >-
    No /.well-known/openid-configuration on any Upstox host (404 on upstox.com, api.upstox.com,
    api-v2.upstox.com, api-hft.upstox.com, mcp.upstox.com) and no openIdConnect securityScheme in the
    OpenAPI. Upstox is an OAuth 2.0 authorization provider, not an OpenID Connect identity provider.
  source: well-known/upstox-well-known.yml
- id: openapi
  conforms: true
  evidence: >-
    OpenAPI 3.1.0 served live at https://api.upstox.com/v2/api-docs — 95 paths, 101 operations, 211
    component schemas, unique operationIds throughout, one declared securityScheme applied across the
    surface.
  source: openapi/upstox-developer-api-openapi.yml
- id: mcp
  conforms: true
  evidence: >-
    Hosted Model Context Protocol server at https://mcp.upstox.com/mcp. A tools/list JSON-RPC POST
    returned HTTP 401 {"error":"invalid_token"} on 2026-09-02, which is the correct MCP authorization
    behaviour — the endpoint exists and is OAuth protected. Client setup is documented for Claude
    Desktop, Claude Code, ChatGPT, Cursor and VS Code with GitHub Copilot.
  source: https://upstox.com/developer/api-documentation/mcp-integration
- id: rfc9457
  conforms: false
  evidence: >-
    Errors use a bespoke {"status":"error","errors":[...]} envelope with error_code/message/property_path/
    invalid_value, not application/problem+json. No type/title/status/detail/instance members.
  source: errors/upstox-error-codes.yml
- id: idempotency
  conforms: false
  evidence: >-
    No idempotency key header on any operation, including order placement, multi-order placement, payout
    initiation and IPO application. The term does not appear in the OpenAPI or the documentation.
  source: conventions/upstox-conventions.yml
- id: pagination
  conforms: partial
  evidence: >-
    Page-number pagination is present on 11 operations via page_number, with page_size on 6 and `records`
    on 5 others, but the response envelope defines no pagination metadata (no total, next cursor or
    has_more). No RFC 8288 Link header.
  source: conventions/upstox-conventions.yml
- id: rfc8594
  conforms: false
  evidence: >-
    No Sunset or Deprecation response headers, and zero operations carry deprecated:true in the OpenAPI
    despite nine v2 endpoints being formally deprecated on the announcements page.
  source: lifecycle/upstox-lifecycle.yml
- id: rfc9116
  conforms: false
  evidence: >-
    /.well-known/security.txt returned HTTP 403 on upstox.com (an object-store AccessDenied XML body) and
